name: Build Madeira IPA

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  IOS_DEPLOYMENT_TARGET: "17.0"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 350

    steps:

      # ==============================================================
      # CHECKOUT + ENVIRONMENT
      # ==============================================================

      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euxo pipefail
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$DEVELOPER_DIR" \
            || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Host dependencies
        run: |
          set -euxo pipefail
          brew install cmake ninja meson pkg-config bison flex sevenzip
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Metal toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain \
            || echo "downloadComponent unsupported on this Xcode; assuming bundled"

      - name: Verify source tree
        run: |
          set -euxo pipefail
          test -f FEX/CMakeLists.txt
          test -d research/dxmt/src
          test -f wine/configure
          test -f app/Madeira.xcodeproj/project.pbxproj

      # ==============================================================
      # TOOLCHAINS (cached — first run is the expensive one)
      # ==============================================================

      - name: Cache toolchains
        id: tc
        uses: actions/cache@v4
        with:
          path: toolchains
          key: tc-mingw20260421-llvm1507ios-v2

      - name: llvm-mingw
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p toolchains
          curl -L https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz \
            | tar -xJ -C toolchains/
          test -x toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin/aarch64-w64-mingw32-clang

      # Two-stage per build/dxmt-ios/README.md.
      #
      # AddLLVM.cmake edit: swaps --gc-sections for -dead_strip (Apple ld).
      #
      # iOS stage builds LIBRARIES ONLY. Tools must be excluded: under
      # CMAKE_SYSTEM_NAME=iOS every executable is treated as MACOSX_BUNDLE,
      # and LLVM's install() for each tool then fails with "no BUNDLE
      # DESTINATION". airconv links the static libs, not the tools.
      - name: LLVM 15.0.7 for iOS
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch llvmorg-15.0.7 \
            https://github.com/llvm/llvm-project toolchains/llvm-project
          sed -i '' 's/MATCHES "Darwin"/MATCHES "Darwin|iOS"/' \
            toolchains/llvm-project/llvm/cmake/modules/AddLLVM.cmake

          cmake -S toolchains/llvm-project/llvm -B toolchains/llvm-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF
          cmake --build toolchains/llvm-host --target llvm-tblgen

          cmake -S toolchains/llvm-project/llvm -B toolchains/llvm-ios-build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TABLEGEN="$PWD/toolchains/llvm-host/bin/llvm-tblgen" \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TOOLS=OFF \
            -DLLVM_BUILD_UTILS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_RUNTIMES=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_ZLIB=OFF
          cmake --build toolchains/llvm-ios-build
          ls toolchains/llvm-ios-build/lib/*.a | head

      # ==============================================================
      # SOURCES NOT TRACKED AS SUBMODULES
      # ==============================================================

      - name: FreeType source
        run: |
          set -euxo pipefail
          rm -rf research/freetype
          git clone --depth 1 --branch VER-2-13-3 \
            https://github.com/freetype/freetype.git research/freetype

      # Twelve Microsoft DLLs. Gitignored deliberately (not redistributable);
      # the pbxproj has a folder reference, so the directory must exist.
      # The layout inside VC_redist varies by version — recent ones are Burn
      # bundles with no .rsrc/1033/CABINET path — so expand everything and
      # locate the files by name.
      - name: MSVC runtime DLLs
        run: |
          set -euo pipefail
          DEST="$PWD/app/Madeira/x86_64-vcruntime"
          mkdir -p "$DEST"
          WORK=/tmp/vcr
          rm -rf "$WORK" && mkdir -p "$WORK"
          cd "$WORK"
          curl -sL -o vc.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
          7zz x vc.exe -oL0 -y >/dev/null 2>&1 || true
          for pass in 1 2 3 4; do
            expanded=0
            while IFS= read -r f; do
              out="${f}.x"
              [ -d "$out" ] && continue
              if 7zz x "$f" -o"$out" -y >/dev/null 2>&1; then
                expanded=1
              else
                rm -rf "$out"
              fi
            done < <(find . -type f ! -iname '*.dll' ! -name 'vc.exe' -size +4k)
            [ "$expanded" -eq 0 ] && break
          done
          missing=0
          for n in concrt140.dll msvcp140.dll msvcp140_1.dll msvcp140_2.dll \
                   msvcp140_atomic_wait.dll msvcp140_codecvt_ids.dll \
                   vcamp140.dll vccorlib140.dll vcomp140.dll \
                   vcruntime140.dll vcruntime140_1.dll vcruntime140_threads.dll; do
            src="$(find . -type f -iname "$n" -print -quit)"
            if [ -z "$src" ]; then
              echo "MISSING: $n"
              missing=1
            else
              cp "$src" "$DEST/$n"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "===== extracted tree ====="
            find . -type f -iname '*.dll' | head -60
            exit 1
          fi
          ls -l "$DEST"

      # Microsoft's redistribution terms cover these files unmodified, so
      # confirm the Authenticode payload is still intact.
      - name: Verify vcruntime signatures
        run: |
          set -euo pipefail
          python3 - app/Madeira/x86_64-vcruntime/*.dll <<'PY'
          import struct, sys
          bad = 0
          for path in sys.argv[1:]:
              d = open(path, 'rb').read()
              pe = struct.unpack_from('<I', d, 0x3c)[0]
              off, size = struct.unpack_from('<II', d, pe + 24 + 112 + 4*8)
              ok = size and off + size <= len(d)
              print(('signed  ' if ok else 'UNSIGNED'), path)
              if not ok:
                  bad = 1
          sys.exit(bad)
          PY

      # ==============================================================
      # WINE HOST TREE
      # Only generated headers are consumed by the unix builds; config.h
      # comes straight from configure (AC_CONFIG_HEADERS), so no full
      # Wine build is required.
      # ==============================================================

      - name: Wine host headers
        run: |
          set -euxo pipefail
          export PATH="$PWD/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:$PATH"
          cd wine
          mkdir -p build-macos && cd build-macos
          ../configure --enable-win64 --disable-tests --without-x --without-freetype
          test -f include/config.h || { echo "configure produced no config.h"; exit 1; }
          make -j"$(sysctl -n hw.ncpu)" include dlls/ntdll dlls/win32u || true

      # ==============================================================
      # FEX
      #
      # FEX_IOS_HOST: the fork gates its iOS externs (IosCbEntryLog,
      # IosFfsBypassLog, IosJitReverseTranslate) behind this define while
      # the code that USES them is ungated. Without it, Core.cpp fails
      # with 14 undeclared-identifier errors. FEX only ever APPENDS to
      # CMAKE_CXX_FLAGS, so passing it here is safe.
      #
      # CMAKE_SYSTEM_PROCESSOR is forced because Apple's CMake platform
      # can leave it empty, breaking FEX's architecture detection.
      # ==============================================================

      - name: Cache FEX build
        id: fex
        uses: actions/cache@v4
        with:
          path: FEX/build-ios
          key: fex-053c385-iosHost-v2

      - name: Configure FEX
        if: steps.fex.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          cmake -S FEX -B FEX/build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_C_FLAGS="-DFEX_IOS_HOST=1" \
            -DCMAKE_CXX_FLAGS="-DFEX_IOS_HOST=1" \
            -DBUILD_TESTING=OFF \
            -DBUILD_TESTS=False \
            -DBUILD_THUNKS=OFF \
            -DENABLE_VIXL_DISASSEMBLER=OFF \
            -DENABLE_VIXL_SIMULATOR=OFF \
            -DENABLE_CCACHE=OFF \
            -DENABLE_LTO=False \
            -DTUNE_CPU=none \
            -DTUNE_ARCH=generic

      - name: Build FEX
        if: steps.fex.outputs.cache-hit != 'true'
        run: |
          set -uxo pipefail
          cmake --build FEX/build-ios \
            --target FEXCore FEXCore_Base JemallocLibs \
            --parallel "$(sysctl -n hw.ncpu)" 2>&1 | tee /tmp/fex.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "===== errors ====="
            grep -n "error:" /tmp/fex.log | head -40
          fi
          exit "$rc"

      - name: Verify FEX libraries
        run: |
          set -euxo pipefail
          find FEX/build-ios -name "*.a" -type f | sort
          for n in libFEXCore.a libFEXCore_Base.a libJemallocLibs.a \
                   libfmt.a libcephes_128bit.a libxxhash.a libsoftfloat_3e.a; do
            f="$(find FEX/build-ios -name "$n" -type f -print -quit)"
            test -n "$f" || { echo "MISSING $n"; exit 1; }
            lipo -info "$f"
          done

      # ==============================================================
      # NATIVE LIBS
      # ==============================================================

      - name: GnuTLS stack (GMP -> nettle -> GnuTLS)
        run: bash build/gnutls-ios/build.sh

      - name: FreeType for iOS
        run: |
          set -euxo pipefail
          bash build/freetype-ios/build.sh
          test -f build/freetype-ios/build/libfreetype.a

      - name: Wine unix libs
        run: |
          set -euxo pipefail
          bash build/ntdll-unix/build.sh
          bash build/win32u-unix/build.sh
          bash build/wineserver/build.sh

      # DXMT: PE modules via meson, then the unix side, then merged with
      # the LLVM iOS archives into libdxmt_combined.a — which is what the
      # pbxproj links (NOT libdxmt_unix.a).
      - name: DXMT
        run: |
          set -euxo pipefail
          ln -sfn ../../toolchains research/dxmt/toolchains
          export PATH="$PWD/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:/opt/homebrew/bin:$PATH"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          cd research/dxmt
          meson setup --cross-file build-aarch64-win.txt --native-file build-osx.txt \
            -Dwine_build_path=../../wine/build-macos build-pe
          meson compile -C build-pe
          cp build-pe/src/d3d11/d3d11.dll \
             build-pe/src/dxgi/dxgi.dll \
             build-pe/src/winemetal/winemetal.dll \
             build-pe/src/d3d10/d3d10core.dll \
             ../../app/Madeira/aarch64-windows/
          cd ../../build/dxmt-ios
          ./build.sh
          xcrun -sdk iphoneos libtool -static -o libdxmt_combined.a \
            obj/*.o ../../toolchains/llvm-ios-build/lib/*.a
          cp libdxmt_combined.a ../../app/Madeira/

      - name: Verify all linked libraries
        run: |
          set -euxo pipefail
          for l in libgmp libgnutls libhogweed libnettle \
                   libntdll_unix libwin32u_unix libwineserver libdxmt_combined; do
            test -f "app/Madeira/$l.a" || { echo "MISSING app/Madeira/$l.a"; exit 1; }
            ls -lh "app/Madeira/$l.a"
          done

      # ==============================================================
      # APP
      # No shared scheme exists in the pbxproj (no xcshareddata/), so
      # -target is required; -scheme and -destination will both fail.
      # The action verb goes last.
      # ==============================================================

      - name: Inspect Xcode project
        run: xcodebuild -project app/Madeira.xcodeproj -list || true

      - name: Build Madeira.app
        run: |
          set -euxo pipefail
          rm -rf out
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -target Madeira \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/out" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          set -euxo pipefail
          test -d out/Madeira.app
          lipo -info out/Madeira.app/Madeira
          rm -rf artifacts
          mkdir -p artifacts/Payload
          cp -R out/Madeira.app artifacts/Payload/Madeira.app
          cd artifacts && zip -qry Madeira.ipa Payload
          unzip -l Madeira.ipa | grep -q "Payload/Madeira.app/Madeira"
          ls -lh Madeira.ipa

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira
          path: |
            artifacts/Madeira.ipa
            /tmp/fex.log
            wine/build-macos/config.log
            research/dxmt/build-pe/meson-logs/**
          if-no-files-found: warn
          retention-days: 7
