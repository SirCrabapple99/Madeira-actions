name: Probe (no LLVM, no FEX)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Environment
        run: |
          set -euxo pipefail
          sudo xcode-select -s "$DEVELOPER_DIR" \
            || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | tail -1)"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          brew install cmake ninja meson pkg-config bison flex sevenzip
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      # --------------------------------------------------------------
      # PROBE 1 — what does the Xcode project actually want?
      # --------------------------------------------------------------
      - name: Xcode project shape
        continue-on-error: true
        run: |
          set -x
          xcodebuild -project app/Madeira.xcodeproj -list
          echo "--- shared schemes (expect none) ---"
          ls -la app/Madeira.xcodeproj/xcshareddata/xcschemes/ 2>&1 || true
          echo "--- linked libs ---"
          grep -oE 'path = [^;]*\.a;' app/Madeira.xcodeproj/project.pbxproj | sort -u
          echo "--- library search paths ---"
          grep -A8 LIBRARY_SEARCH_PATHS app/Madeira.xcodeproj/project.pbxproj | head -30
          echo "--- already committed ---"
          find app -name '*.a' | sort

      # --------------------------------------------------------------
      # PROBE 2 — vcruntime (fixed: arch suffix stripped before .dll,
      # arm64 copies excluded — a11 is arm64, a12 is amd64)
      # --------------------------------------------------------------
      - name: MSVC runtime DLLs
        continue-on-error: true
        run: |
          set -euo pipefail
          DEST="$PWD/app/Madeira/x86_64-vcruntime"
          mkdir -p "$DEST"
          WORK=/tmp/vcr; rm -rf "$WORK"; mkdir -p "$WORK"; cd "$WORK"
          curl -sL -o vc.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
          python3 - <<'PY'
          import re
          d = open('vc.exe', 'rb').read()
          offs = [m.start() for m in re.finditer(b'MSCF\x00\x00\x00\x00', d)]
          print('cab offsets:', offs)
          for i, o in enumerate(offs):
              open('carve%d.cab' % i, 'wb').write(d[o:])
          PY
          for c in carve*.cab; do 7zz x "$c" -o"${c}.x" -y >/dev/null 2>&1 || true; done
          for pass in 1 2 3; do
            expanded=0
            while IFS= read -r f; do
              out="${f}.x"; [ -d "$out" ] && continue
              if 7zz x "$f" -o"$out" -y >/dev/null 2>&1; then expanded=1; else rm -rf "$out"; fi
            done < <(find . -type f -size +4k ! -name 'vc.exe' ! -name 'carve*.cab')
            [ "$expanded" -eq 0 ] && break
          done
          python3 - "$DEST" <<'PY'
          import os, re, shutil, sys
          dest = sys.argv[1]
          want = ["concrt140", "msvcp140", "msvcp140_1", "msvcp140_2",
                  "msvcp140_atomic_wait", "msvcp140_codecvt_ids", "vcamp140",
                  "vccorlib140", "vcomp140", "vcruntime140", "vcruntime140_1",
                  "vcruntime140_threads"]
          found = {}
          for root, _, files in os.walk('.'):
              for fn in files:
                  low = fn.lower()
                  if 'arm64' in low:
                      continue
                  p = os.path.join(root, fn)
                  try:
                      with open(p, 'rb') as fh:
                          if fh.read(2) != b'MZ':
                              continue
                  except OSError:
                      continue
                  k = re.sub(r'^f_central_', '', low)
                  k = re.sub(r'_(amd64|x64)$', '', k)
                  k = re.sub(r'\.dll$', '', k)
                  k = re.sub(r'_(amd64|x64)$', '', k)
                  if k in want and k not in found:
                      found[k] = p
          for k in sorted(found):
              shutil.copy(found[k], os.path.join(dest, k + '.dll'))
              print('ok', k, '<-', found[k])
          missing = [w for w in want if w not in found]
          if missing:
              print('MISSING:', missing)
              sys.exit(1)
          PY
          ls -l "$DEST"
          file "$DEST/vcruntime140.dll"

      # --------------------------------------------------------------
      # PROBE 3 — llvm-mingw (cheap: download only)
      # --------------------------------------------------------------
      - name: llvm-mingw
        continue-on-error: true
        run: |
          set -euxo pipefail
          mkdir -p toolchains
          curl -fL https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz \
            | tar -xJ -C toolchains/
          ls toolchains/
          toolchains/llvm-mingw-*/bin/aarch64-w64-mingw32-clang --version

      # --------------------------------------------------------------
      # PROBE 4 — the big unknown: does wine configure accept these flags?
      # --------------------------------------------------------------
      - name: Wine configure
        continue-on-error: true
        run: |
          set -xo pipefail
          export PATH="$PWD/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:$PATH"
          cd wine && mkdir -p build-macos && cd build-macos
          ../configure --enable-win64 --disable-tests --without-x --without-freetype 2>&1 | tail -40
          echo "=== config.h present? ==="
          ls -l include/config.h || echo "NO CONFIG.H"
          echo "=== do the dir targets exist? ==="
          make -n include >/dev/null 2>&1 && echo "target 'include' OK" || echo "target 'include' INVALID"
          make -n dlls/ntdll >/dev/null 2>&1 && echo "target 'dlls/ntdll' OK" || echo "target 'dlls/ntdll' INVALID"
          make -n dlls/win32u >/dev/null 2>&1 && echo "target 'dlls/win32u' OK" || echo "target 'dlls/win32u' INVALID"

      - name: Wine headers
        continue-on-error: true
        run: |
          set -xo pipefail
          cd wine/build-macos
          make -j"$(sysctl -n hw.ncpu)" include dlls/ntdll dlls/win32u 2>&1 | tail -30 || true
          echo "=== what the unix builds need ==="
          ls include/config.h 2>&1
          ls -d include dlls/ntdll dlls/win32u 2>&1

      # --------------------------------------------------------------
      # PROBE 5 — what do the build scripts expect? (read, don't run)
      # --------------------------------------------------------------
      - name: Build script requirements
        continue-on-error: true
        run: |
          set -x
          for f in build/ntdll-unix/build.sh build/win32u-unix/build.sh \
                   build/wineserver/build.sh build/dxmt-ios/build.sh \
                   build/gnutls-ios/build.sh build/freetype-ios/build.sh; do
            echo "########## $f"
            cat "$f"
          done

      # --------------------------------------------------------------
      # PROBE 6 — DXMT meson setup only (no compile; fast, and tells us
      # whether the wine headers + mingw are wired correctly)
      # --------------------------------------------------------------
      - name: DXMT meson setup
        continue-on-error: true
        run: |
          set -xo pipefail
          ls research/dxmt/*.txt 2>&1 || true
          ln -sfn ../../toolchains research/dxmt/toolchains
          export PATH="$PWD/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:/opt/homebrew/bin:$PATH"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          cd research/dxmt
          meson setup --cross-file build-aarch64-win.txt --native-file build-osx.txt \
            -Dwine_build_path=../../wine/build-macos build-pe 2>&1 | tail -40 || true
          ls build-pe 2>&1 || echo "meson setup did not produce build-pe"

      # --------------------------------------------------------------
      # PROBE 7 — cheap native lib builds (minutes, not hours)
      # --------------------------------------------------------------
      - name: FreeType
        continue-on-error: true
        run: |
          set -xo pipefail
          git clone --depth 1 --branch VER-2-13-3 \
            https://github.com/freetype/freetype.git research/freetype
          bash build/freetype-ios/build.sh 2>&1 | tail -20
          find . -name libfreetype.a

      - name: Wine unix libs
        continue-on-error: true
        run: |
          set -xo pipefail
          bash build/ntdll-unix/build.sh 2>&1 | tail -30
          bash build/win32u-unix/build.sh 2>&1 | tail -30
          bash build/wineserver/build.sh 2>&1 | tail -30
          ls -l app/Madeira/*.a 2>&1

      # --------------------------------------------------------------
      # SUMMARY
      # --------------------------------------------------------------
      - name: Summary
        if: always()
        run: |
          echo "===== present in app/Madeira ====="
          ls -l app/Madeira/*.a 2>/dev/null || echo "none"
          ls app/Madeira/x86_64-vcruntime 2>/dev/null | wc -l
          echo "===== wine ====="
          ls wine/build-macos/include/config.h 2>/dev/null || echo "no config.h"
          echo "===== dxmt ====="
          ls research/dxmt/build-pe >/dev/null 2>&1 && echo "meson configured" || echo "meson NOT configured"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-logs
          path: |
            wine/build-macos/config.log
            research/dxmt/build-pe/meson-logs/**
            app/Madeira/x86_64-vcruntime/**
          if-no-files-found: warn
