name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build native chains (Wine, FEX, DXMT)
        run: |
          for d in build/*/; do
            [ -f "$d/build.sh" ] && bash "$d/build.sh"
          done

      - name: Fetch vcruntime DLLs
        run: bash tools/fetch-vcruntime.sh   # check exact filename in tools/

      - name: Build and archive iOS app
        run: |
          xcodebuild archive \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -archivePath build/Madeira.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Export unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Madeira.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r Madeira-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Madeira-ipa
          path: build/Madeira-unsigned.ipa
